# The Recipe: true colour by day, infrared clouds over city lights by night,
# blended across the terminator. This file holds what every sensor shares;
# abi.yaml, ahi.yaml and fci.yaml name each sensor's bands for the day layer;
# seviri.yaml makes its colour from bands that are not colours.
# It follows satpy's geo_color and departs from it where the Comparison scenes
# showed a difference from CIRA's GeoColor.
sensor_name: visir

modifiers:
  # satpy's 1 / cos(sun zenith) normalisation, held constant beyond
  # correction_limit and faded to nothing at max_sza.
  georing_sunz:
    modifier: !!python/name:satpy.modifiers.SunZenithCorrector
    correction_limit: 80
    max_sza: 95
    optional_prerequisites:
      - solar_zenith_angle

  # satpy's Rayleigh correction, faded out toward the terminator. At full
  # strength it removes more blue than a low sun puts in, and dusk turns olive.
  # 0.64 um names the red band of all three sensors; satpy's own 0.67 um lies
  # outside AHI's.
  georing_rayleigh:
    modifier: !!python/name:satpy.modifiers.PSPRayleighReflectance
    atmosphere: us-standard
    aerosol_type: rayleigh_only
    reduce_lim_low: 70
    reduce_lim_high: 88
    reduce_strength: 0.9
    prerequisites:
      - wavelength: 0.64
        modifiers: [georing_sunz]
    optional_prerequisites:
      - satellite_azimuth_angle
      - satellite_zenith_angle
      - solar_azimuth_angle
      - solar_zenith_angle

composites:
  # Day and night joined across the terminator. From 76 to 78 degrees of sun
  # zenith the day layer is stretched to 1.2/1.3/1.4 times itself less
  # 30/45/65 levels (R, G, B): that takes out the blue haze the Rayleigh fade
  # leaves, so the low-sun sea is dark and cloud shadows are not blue, as in
  # CIRA's GeoColor. The night layer comes in from 82 to 86 degrees, mixed
  # as light. Fitted on the twilight scenes, with h-dawn and h-dusk held out.
  georing:
    compositor: !!python/name:georing.recipe.TwilightCompositor
    lim_low: 82
    lim_high: 86
    stretch_start: 76
    stretch_end: 78
    gain: [1.2, 1.3, 1.4]
    offset: [30, 45, 65]
    standard_name: georing
    prerequisites:
      - georing_day
      - georing_night

  # The clouds over the city lights. The clouds are put together on the
  # infrared grid, where they are made, and come up to the finest grid as one
  # layer; only there do they meet the lights, which stay at 500 m. Made
  # there from three layers, the night layer took a render twice the memory.
  georing_night:
    compositor: !!python/name:satpy.composites.fill.BackgroundCompositor
    standard_name: night_ir_with_background
    prerequisites:
      - georing_night_clouds
      - georing_city_lights

  # High cloud over low cloud, with the opacity of both.
  georing_night_clouds:
    compositor: !!python/name:satpy.composites.fill.BackgroundCompositor
    standard_name: georing_night_clouds
    prerequisites:
      - georing_high_clouds
      - georing_low_clouds

  # The infrared window band as a near-white sheet (level 250, see the
  # enhancement) whose opacity follows the cloud-top temperature. CIRA draws
  # it white (Miller et al. 2020, Eq. 8); satpy's geo_color greys it by
  # temperature as well, which leaves cold clear ground and low cloud dark.
  # The opacity ramps from 296 K to 178 K in the tropics and 198 K poleward
  # of 60 degrees, with a gamma of 0.95: no storm top is flat white, as none
  # is in CIRA's, which brightens by about 1.6 levels per kelvin down to
  # 184 K at least. satpy's ramp ends at 210/230 K and turned such cloud into
  # a flat white. The level, ramp and gamma were fitted to CIRA's pixels on
  # the storm scenes, each scene checked with the fit to the other.
  georing_high_clouds:
    compositor: !!python/name:satpy.composites.mask.HighCloudCompositor
    standard_name: georing_high_clouds
    transition_min_limits: [178, 198]
    transition_max: 296
    transition_gamma: 0.95
    prerequisites:
      - wavelength: 10.4

  # Low cloud by night: the 10.4 - 3.9 um difference, opaque light blue from
  # 4 K up. satpy's geo_color starts the ramp at 1.5 K over land for FCI and
  # at 0 K for ABI and AHI; CIRA's GeoColor starts near 0 K on every sensor,
  # which tints dry ground (lower emissivity at 3.9 um) bluish-lilac.
  georing_low_clouds:
    compositor: !!python/name:satpy.composites.mask.LowCloudCompositor
    standard_name: geo_color_low_clouds
    values_water: 0
    values_land: 100
    range_land: [0.0, 4.0]
    range_water: [0.0, 4.0]
    prerequisites:
      - compositor: !!python/name:satpy.composites.arithmetic.DifferenceCompositor
        prerequisites:
          - {wavelength: 10.4, calibration: brightness_temperature}
          - {wavelength: 3.9, calibration: brightness_temperature}
      - {wavelength: 10.4, calibration: brightness_temperature}
      - georing_land_water_mask

  # The land mask is a file under SATPY_DATA_DIR, which georing.static
  # fetches and checks against its checksum.
  georing_land_water_mask:
    compositor: !!python/name:satpy.composites.aux_data.StaticImageCompositor
    standard_name: land_water_mask
    filename: composites/gshhs_land_water_mask_3km_i.tif

  # The city lights: a year of VIIRS night radiance at 500 m with a land
  # mask, NASA's Black Marble VJ146A4. All of it is in georing.lights, which
  # builds the file once; the step environment names it.
  georing_city_lights:
    compositor: !!python/name:georing.lights.layer.CityLights
    standard_name: georing_city_lights
    filename: ${GEORING_CITY_LIGHTS}
