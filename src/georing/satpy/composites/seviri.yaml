sensor_name: visir/seviri

composites:
  # SEVIRI has no blue or green band. Its day colour is looked up in a table
  # of the colour its neighbours show, before the enhancement, for each
  # combination of SEVIRI's three day bands, so that Meteosat-9 meets them at
  # a Seam in one colour and takes FCI's tone curves. georing-fit-colour made
  # the table from where Meteosat-9 and a neighbour both see the ground within
  # 65 degrees of vertical and the sun is within 70 degrees of overhead: MTG-I1
  # on 2026-11-10 at 07:00, 09:00 and 11:00 and 2026-09-20 at 09:00 and 11:00
  # UTC (the green Sahel), and Himawari's clear land on six Slots of the same
  # days (India's crops); 2026-11-10 13:00 and 2026-11-19 05:00 were only
  # measured (georing.fit, and the notes). Where the table is not to be trusted
  # the colour fades to a neutral grey, over 8 degrees of sun or view and 20%
  # past the table's end: there the bands,
  # divided by a low sun or seen along the limb, reach combinations it never
  # saw (at Antarctica's limb 150 to 340%, where it ends at 110%), and its
  # edges, filled by a polynomial, are orange. The view's fade starts at 58
  # degrees, short of the table's 65: on Meteosat-9's southern limb the
  # colour turned salmon from 61. The sun's starts at 80, where the night
  # layer comes in: from 70 it greyed the dusk-seviri scene, 1.4 levels
  # further from CIRA. The grey is the uncorrected 0.8 um band divided by the
  # sun as if it stood no lower than 60 degrees: the full correction
  # multiplies it by up to six there and turned the limb white, where CIRA's
  # is a muted grey. The sea in the sun's reflection fades to the grey too,
  # from a glint angle of 22 degrees to 12: there all three bands are bright
  # and the table, which never saw glint, made the sea beige, with orange at
  # its centre (2026-11-19 03:00, south of India). Clear sea keeps its blue
  # from 24 degrees out; Himawari and the GOES draw their glint grey.
  # Before any of that, cloud and haze lose their tint as the sun goes from
  # 64 to 76 degrees, keeping their brightness, where the mean colour goes
  # from 10 to 20%; the sea keeps its blue. The table was made under a sun
  # within 70 degrees, and at a low sun it painted thin, broken cloud salmon
  # (2026-11-20 01:00, the southern Indian Ocean at dawn: the brightest
  # tenth of cloud 14 to 24 levels redder than blue at 70 to 84 degrees, at
  # most 5 after), where CIRA's is grey. dusk-seviri moves from 9.7 to 9.6.
  # Over water only: bright desert and hazy land lost their colour with it,
  # Arabia at 04:00 and India at 02:00 on 2026-11-22 a bright grey where the
  # table, untouched, gives them the colour they show by day. Bright cloud
  # over land keeps its own, nearly grey: under a sun of 60 to 80 degrees
  # its median red is 1.0 to 1.5% above its blue.
  georing_day:
    compositor: !!python/name:georing.recipe.ColourTable
    standard_name: georing_day
    filename: seviri_colour.npz
    sun_limit: 80
    view_limit: 58
    fade_width: 8
    table_top: 110
    top_width: 20
    grey_sun_cap: 60
    glint_angle: [12, 22]
    tint_sun: [64, 76]
    tint_bright: [10, 20]
    prerequisites:
      - name: VIS006
        modifiers: [georing_sunz, georing_rayleigh]
      - name: VIS008
        modifiers: [georing_sunz]
      - name: IR_016
        modifiers: [georing_sunz]
      # Uncorrected, for the grey the colour fades to.
      - name: VIS008
      # Glint fades the colour over water only.
      - georing_land_water_mask

  # Low cloud by night, as in visir.yaml but with the ramp moved up. SEVIRI's
  # 10.8 - 3.9 um difference runs higher than FCI's over the same clear ground
  # at the same time: by 2.6 K over land and 3.3 K over sea (medians where
  # both satellites see the ground within 65 degrees of vertical and FCI's
  # 10.5 um reads 285-295 K, 2026-11-10 00:00 UTC). Unmoved, it painted clear
  # ground as fog.
  georing_low_clouds:
    compositor: !!python/name:satpy.composites.mask.LowCloudCompositor
    standard_name: geo_color_low_clouds
    values_water: 0
    values_land: 100
    range_land: [2.6, 6.6]
    range_water: [3.3, 7.3]
    prerequisites:
      - compositor: !!python/name:satpy.composites.arithmetic.DifferenceCompositor
        prerequisites:
          - {wavelength: 10.4, calibration: brightness_temperature}
          - {wavelength: 3.9, calibration: brightness_temperature}
      - {wavelength: 10.4, calibration: brightness_temperature}
      - georing_land_water_mask
